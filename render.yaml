services:
  - type: web
    name: rims-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: POSTGRES_HOST
        fromDatabase:
          name: rims-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: rims-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: rims-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: rims-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: rims-postgres
          property: password

databases:
  - name: rims-postgres
    databaseName: rims_db
    user: rims_user
    plan: free
    region: oregon
